{% extends 'base.html' %}{% block content %}<div class="row-actions"><a class="btn" href="{{url_for('product_new')}}">제품 홍보등록</a></div><div class="card"><h1>등록현황</h1><table><tr><th>제품명</th><th>카테고리</th><th>최초 등록일</th><th>최종 수정일</th><th>관리</th></tr>{% for p in products %}<tr><td>{{p.product_name}}</td><td>{{p.category}}</td><td>{{p.created_at}}</td><td>{{p.updated_at}}</td><td><a href="{{url_for('product_edit',pid=p.id)}}">수정</a> | <a href="{{url_for('product_history',pid=p.id)}}">수정이력</a></td></tr>{% else %}<tr><td colspan="5">등록된 제품이 없습니다.</td></tr>{% endfor %}</table></div>{% endblock %}
