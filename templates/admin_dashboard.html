{% extends 'base.html' %}{% block content %}<div class="grid"><div class="card"><h2>등록업체</h2><p style="font-size:32px">{{vendor_count}}</p><a href="{{url_for('admin_vendors')}}">업체현황 보기</a></div><div class="card"><h2>등록제품</h2><p style="font-size:32px">{{product_count}}</p><a href="{{url_for('admin_products')}}">제품현황 보기</a></div></div><div class="card"><h2>최근 등록제품</h2><table><tr><th>등록일</th><th>업체명</th><th>제품명</th><th>카테고리</th></tr>{% for p in recent %}<tr><td>{{p.created_at}}</td><td>{{p.company_name}}</td><td><a href="{{url_for('admin_product_detail',pid=p.id)}}">{{p.product_name}}</a></td><td>{{p.category}}</td></tr>{% endfor %}</table></div>{% endblock %}
