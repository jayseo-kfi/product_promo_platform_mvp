<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}제품홍보 등록 플랫폼{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header><strong>제품홍보 등록 플랫폼</strong><nav><a href="{{ url_for('index') }}">소개</a>{% if session.user_id %}{% if session.role=='admin' %}<a href="{{ url_for('admin_dashboard') }}">관리자</a>{% else %}<a href="{{ url_for('vendor_dashboard') }}">내 제품</a>{% endif %}<a href="{{ url_for('logout') }}">로그아웃</a>{% else %}<a href="{{ url_for('register') }}">회원가입</a><a href="{{ url_for('login') }}">로그인</a>{% endif %}</nav></header><main class="container">{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="flash">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
