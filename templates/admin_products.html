{% extends 'base.html' %}{% block content %}<div class="card"><h1>등록제품 현황</h1><form method="get" class="grid-3"><div><label>카테고리</label><select name="category"><option value="">전체</option>{% for c in CATEGORIES %}<option value="{{c}}" {% if category==c %}selected{% endif %}>{{c}}</option>{% endfor %}</select></div><div><label>검색</label><input name="q" value="{{q}}" placeholder="제품명·업체명·제조사"></div><div><label>정렬</label><select name="order"><option value="new" {% if order=='new' %}selected{% endif %}>최신순</option><option value="old" {% if order=='old' %}selected{% endif %}>오래된순</option></select></div><div class="row-actions"><button class="btn">조회</button><a class="btn secondary" href="{{url_for('export_xlsx',category=category)}}">현재 카테고리 엑셀 다운로드</a></div></form></div><div class="card"><table><tr><th>등록일</th><th>카테고리</th><th>업체명</th><th>제품명</th><th>제조사</th><th>담당자</th></tr>{% for r in rows %}<tr><td>{{r.created_at}}</td><td>{{r.category}}</td><td>{{r.company_name}}</td><td><a href="{{url_for('admin_product_detail',pid=r.id)}}">{{r.product_name}}</a></td><td>{{r.manufacturer}}</td><td>{{r.contact_name}}<br>{{r.phone}}<br>{{r.email}}</td></tr>{% else %}<tr><td colspan="6">조회 결과가 없습니다.</td></tr>{% endfor %}</table></div>{% endblock %}
