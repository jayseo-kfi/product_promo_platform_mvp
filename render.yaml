services:
  - type: web
    name: product-promo-platform
    runtime: python
    plan: starter

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT app:app

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7

      - key: DATA_DIR
        value: /opt/render/project/src/storage

      - key: SECRET_KEY
        generateValue: true

      - key: ADMIN_COMPANY_NAME
        value: 기관관리자

      - key: ADMIN_CONTACT_NAME
        value: 관리자

      - key: ADMIN_PHONE
        value: 000-0000-0000

      - key: ADMIN_EMAIL
        value: admin@example.com

      - key: ADMIN_PASSWORD
        sync: false

    disk:
      name: product-platform-storage
      mountPath: /opt/render/project/src/storage
      sizeGB: 1